; NutShellGPU 1.1 - 所有延时均为可配置的模拟值
[timing_v11]
core_clock_ghz = 1.0
move_latency = 1
integer_latency = 2
imul_latency = 4
idiv_latency = 32
shuffle_latency = 4
rf_read_ports_per_bank = 1
writeback_ports = 1
execution_slots = 16
lsu_slots = 32
atomic_latency = 16

[sm_pipeline]
sp_latency = 4
sp_init_interval = 1
sfu_latency = 8
sfu_init_interval = 2
dp_latency = 8
dp_init_interval = 2
branch_latency = 1
rf_logical_banks = 4
num_collector_units = 8

[latency_ns]
smem_hit = 2
l1_hit = 30
l2_hit = 180
dram_row_hit = 400
barrier_resume = 4
